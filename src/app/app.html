<header class="masthead">
  <div class="shell header-inner">
    <a class="brand" routerLink="/"><span class="brand-mark" aria-hidden="true">M</span> My Marketplace</a>
    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Browse</a>
      <a routerLink="/categories" routerLinkActive="active">Categories</a>
      @if (api.user(); as user) {
        <a routerLink="/listings" routerLinkActive="active">My Listings</a>
        <a routerLink="/favorites" routerLinkActive="active">Favorites</a>
        <a routerLink="/orders" routerLinkActive="active">Orders</a>
        <button type="button" class="text-button" (click)="logout()" [attr.aria-label]="'Log out ' + user.name">Log out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Log in</a>
        <a routerLink="/register" routerLinkActive="active">Register</a>
      }
      <a class="cart-link" routerLink="/cart">Cart <span>{{api.count()}}</span></a>
    </nav>
  </div>
</header>
<main class="shell">
  @if (error()) { <p class="error" role="alert">{{error()}}</p> }
  <router-outlet />
</main>
<footer class="shell">My Marketplace · Class project demo</footer>
